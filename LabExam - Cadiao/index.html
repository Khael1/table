<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        table {
            border-collapse: separate;
            border-spacing: 3px;
            width: 450px;
            height: 450px;
            margin: 20px auto; 
            text-align: center;
            font-family: Arial, sans-serif; 
            table-layout: fixed;
        }
        td {
            padding: 0;
            width: 150px;
            height: 150px;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }
        img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .red {background-color: rgb(141, 0, 0);}
        .yellow {background-color: yellow;}
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="yellow">College of Business Administration</td>  
            <td class="red">VISION</td>
            <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTcc0oK3AvY-fNeNurFs85wEACKIcVkoQ9r-u7oSMyGUWnPFH23pacIJJA&s=10"</td>
        </tr>
            <td class="red">MISSION</td>
            <td><img src="https://img.magnific.com/premium-vector/digital-circle-circuit-background-vector-futuristic-technology_53876-126032.jpg?semt=ais_hybrid&w=740&q=80"</td>
            <td class="yellow">Computer Science</td>
        <tr>
            <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRRWgihZLkcBXXcsqgLAjXACEnF1dACVwWnpz-bijWjVQ&s=10"</td>
            <td class="yellow">Baguio Central University</td>
            <td class="red">VALUES</td>
        </tr>
    </table>
</body>
</html>
